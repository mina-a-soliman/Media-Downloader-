name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Ensure Gradle Wrapper is Ready
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Artifact Upload
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec ls -lh {} +
          
          # Copy arm64-v8a (Lightweight ~40MB APK for 99% of modern phones)
          if [ -f "app/build/outputs/apk/debug/app-arm64-v8a-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk output_apk/MediaDownloader-v1.0.0-arm64-v8a.apk
          fi

          # Copy armeabi-v7a (Lightweight ~35MB APK for older 32-bit phones)
          if [ -f "app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk output_apk/MediaDownloader-v1.0.0-armeabi-v7a.apk
          fi

          # Copy universal APK if generated
          if [ -f "app/build/outputs/apk/debug/app-universal-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-universal-debug.apk output_apk/MediaDownloader-v1.0.0-universal.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_apk/MediaDownloader-v1.0.0-universal.apk
          fi

          echo "=== Prepared APKs ==="
          ls -lh output_apk/

      - name: Upload Recommended Lightweight APK (arm64-v8a ~40MB)
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-Lite-arm64-v8a
          path: output_apk/MediaDownloader-v1.0.0-arm64-v8a.apk
          retention-days: 30

      - name: Upload All APK Variants
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-All-Variants
          path: output_apk/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
